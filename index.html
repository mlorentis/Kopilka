<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover, interactive-widget=resizes-content">
    <!-- iOS PWA: viewport-fit=cover отдаёт webview весь экран, включая
         зону под индикатором Home. В standalone корень приложения
         (.app-container) крепится position:fixed inset:0 — см. style.css -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#171A1F">
    <!-- PWA -->
    <link rel="manifest" href="manifest.json">
    <link rel="apple-touch-icon" href="apple-touch-icon.png">
    <title>Kopilka</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { sans: ['Inter', 'sans-serif'] }
                }
            }
        }
    </script>
    <script src="https://unpkg.com/@phosphor-icons/web@2.1.1"></script>

    <link rel="stylesheet" href="style.css?v=57">
</head>
<body class="text-[#F5F7FA] font-sans antialiased bg-[#171A1F]">

    <!-- Источник цвета для системного статус-бара iOS 26.1+/27 (см. style.css) -->
    <div id="nt-statusbar-tint" aria-hidden="true"></div>

    <div class="app-container">

        <!-- ШАПКА: flex-ребёнок, физически не скроллится. Контент — JS.
             На внутренних страницах: шеврон назад + .hdr-title по центру
             (появляется при скролле на страницах с большим заголовком) -->
        <header id="main-header">
            <div id="main-header-inner"></div>
        </header>

        <!-- КОНТЕНТ: единственный скроллящийся блок -->
        <div id="app-content">

            <!-- ЭКРАН: HOME -->
            <main id="screen-home" class="screen">
                <!-- NET WORTH (по макету виден всегда, даже в пустом состоянии) -->
                <div id="block-networth" class="flex-col items-center mb-6 py-8" style="display:flex">
                    <p class="text-[#8B93A7] text-[16px] font-semibold leading-[19px] h-[19px] mb-2" data-i18n="netWorth">Net Worth</p>
                    <h1 id="net-worth-amount" class="text-[48px] font-bold leading-[58px] tracking-tight">0<span class="text-[#8B93A7] text-[36px] leading-[44px]">,00 $</span></h1>
                    <p id="delta-row" onclick="ntCycleDelta()" class="text-[16px] font-semibold leading-[19px] h-[19px] mt-2 cursor-pointer active:opacity-70 transition-opacity"><span id="net-worth-delta" class="text-[#8B93A7]">0 $</span><span id="delta-period" class="text-[#8B93A7] ml-1">24h</span></p>
                </div>

                <!-- СЕГМЕНТ ASSET / DEBT -->
                <div id="home-segment" class="glass-ui rounded-full flex items-center h-[54px] p-1 mb-5">
                    <button type="button" id="seg-asset" onclick="ntSetSeg('asset')" class="flex-1 rounded-full text-[15px] font-medium transition-all" data-i18n="asset">Asset</button>
                    <button type="button" id="seg-debt" onclick="ntSetSeg('debt')" class="flex-1 rounded-full text-[15px] font-medium transition-all" data-i18n="debt">Debt</button>
                </div>

                <!-- СЧЕТА: карусель карточек или карточка Add account (рендерит nt.js) -->
                <div id="home-accounts" class="mb-10"></div>

                <!-- OPERATIONS: 3 последние + переход в историю (рендерит nt.js) -->
                <div id="block-operations" class="mb-0">
                    <div id="home-operations-head"></div>
                    <div id="home-operations-list"></div>
                </div>
            </main>

            <!-- ЭКРАН: ACCOUNTS (скрытый, нужен app.js для совместимости) -->
            <main id="screen-accounts" class="screen hidden">
                <div id="acc-segment" class="glass-ui p-1 rounded-full flex mb-8">
                    <button type="button" id="acc-tab-assets" onclick="setAccountTab('asset')" class="flex-1 py-2.5 rounded-full bg-[#232730] text-white text-[15px] font-medium shadow-sm">Assets</button>
                    <button type="button" id="acc-tab-debts" onclick="setAccountTab('debt')" class="flex-1 py-2.5 rounded-full text-[#8B93A7] text-[15px] font-medium">Debts</button>
                </div>
                <div id="accounts-list" class="flex-1 flex flex-col"></div>
            </main>

            <!-- ЭКРАН: HISTORY -->
            <main id="screen-history" class="screen hidden">
                <div id="history-list" class="flex-1 flex flex-col"></div>
            </main>

            <!-- ЭКРАН: PROFILE -->
            <main id="screen-profile" class="screen hidden">
                <div class="flex flex-col items-center pt-6 mb-10">
                    <div class="w-20 h-20 rounded-full bg-[#232730] flex items-center justify-center mb-4">
                        <span class="text-[28px] font-bold leading-[34px]">M</span>
                    </div>
                    <h2 class="text-[28px] font-bold leading-[34px] text-center">Mikhail</h2>
                </div>
                <div class="glass-ui rounded-[24px] px-5 py-[10px] mb-6">
                    <button type="button" onclick="switchTab('language')" class="nt-set-row">
                        <span class="nt-set-icon"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M7.64957 20.9098C7.61957 20.9098 7.57957 20.9298 7.54957 20.9298C5.60957 19.9698 4.02957 18.3798 3.05957 16.4398C3.05957 16.4098 3.07957 16.3698 3.07957 16.3398C4.29957 16.6998 5.55957 16.9698 6.80957 17.1798C7.02957 18.4398 7.28957 19.6898 7.64957 20.9098Z" fill="#F5F7FA"/><path d="M20.94 16.4498C19.95 18.4398 18.3 20.0498 16.29 21.0198C16.67 19.7498 16.99 18.4698 17.2 17.1798C18.46 16.9698 19.7 16.6998 20.92 16.3398C20.91 16.3798 20.94 16.4198 20.94 16.4498Z" fill="#F5F7FA"/><path d="M21.02 7.71047C19.76 7.33047 18.49 7.02047 17.2 6.80047C16.99 5.51047 16.68 4.23047 16.29 2.98047C18.36 3.97047 20.03 5.64047 21.02 7.71047Z" fill="#F5F7FA"/><path d="M7.65047 3.08957C7.29047 4.30957 7.03047 5.54957 6.82047 6.80957C5.53047 7.00957 4.25047 7.32957 2.98047 7.70957C3.95047 5.69957 5.56047 4.04957 7.55047 3.05957C7.58047 3.05957 7.62047 3.08957 7.65047 3.08957Z" fill="#F5F7FA"/><path d="M15.4898 6.59C13.1698 6.33 10.8298 6.33 8.50977 6.59C8.75977 5.22 9.07977 3.85 9.52977 2.53C9.54977 2.45 9.53977 2.39 9.54977 2.31C10.3398 2.12 11.1498 2 11.9998 2C12.8398 2 13.6598 2.12 14.4398 2.31C14.4498 2.39 14.4498 2.45 14.4698 2.53C14.9198 3.86 15.2398 5.22 15.4898 6.59Z" fill="#F5F7FA"/><path d="M6.59 15.4898C5.21 15.2398 3.85 14.9198 2.53 14.4698C2.45 14.4498 2.39 14.4598 2.31 14.4498C2.12 13.6598 2 12.8498 2 11.9998C2 11.1598 2.12 10.3398 2.31 9.55977C2.39 9.54977 2.45 9.54977 2.53 9.52977C3.86 9.08977 5.21 8.75977 6.59 8.50977C6.34 10.8298 6.34 13.1698 6.59 15.4898Z" fill="#F5F7FA"/><path d="M22.0002 11.9998C22.0002 12.8498 21.8802 13.6598 21.6902 14.4498C21.6102 14.4598 21.5502 14.4498 21.4702 14.4698C20.1402 14.9098 18.7802 15.2398 17.4102 15.4898C17.6702 13.1698 17.6702 10.8298 17.4102 8.50977C18.7802 8.75977 20.1502 9.07977 21.4702 9.52977C21.5502 9.54977 21.6102 9.55977 21.6902 9.55977C21.8802 10.3498 22.0002 11.1598 22.0002 11.9998Z" fill="#F5F7FA"/><path d="M15.4898 17.4102C15.2398 18.7902 14.9198 20.1502 14.4698 21.4702C14.4498 21.5502 14.4498 21.6102 14.4398 21.6902C13.6598 21.8802 12.8398 22.0002 11.9998 22.0002C11.1498 22.0002 10.3398 21.8802 9.54977 21.6902C9.53977 21.6102 9.54977 21.5502 9.52977 21.4702C9.08977 20.1402 8.75977 18.7902 8.50977 17.4102C9.66977 17.5402 10.8298 17.6302 11.9998 17.6302C13.1698 17.6302 14.3398 17.5402 15.4898 17.4102Z" fill="#F5F7FA"/><path d="M15.7633 15.7633C13.2622 16.0789 10.7378 16.0789 8.23667 15.7633C7.92111 13.2622 7.92111 10.7378 8.23667 8.23667C10.7378 7.92111 13.2622 7.92111 15.7633 8.23667C16.0789 10.7378 16.0789 13.2622 15.7633 15.7633Z" fill="#F5F7FA"/></svg></span>
                        <span class="flex-1 text-left text-[14px] leading-[17px]" data-i18n="language">Language</span>
                        <span class="flex items-center gap-1 flex-none">
                            <span id="profile-lang-value" class="text-[#8B93A7] text-[14px] leading-[17px]">English</span>
                            <svg width="16" height="16" viewBox="0 0 16 16" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M6.16699 13L11.167 8L6.16699 3" stroke-width="1.33333" stroke-linecap="round" stroke-linejoin="round" stroke="#8B93A7"/></svg>
                        </span>
                    </button>
                    <div class="h-px -mb-px bg-white/10 ml-[34px]"></div>
                    <button type="button" onclick="switchTab('currency')" class="nt-set-row">
                        <span class="nt-set-icon"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M12.75 15.9203H13.4C14.05 15.9203 14.59 15.3403 14.59 14.6403C14.59 13.7703 14.28 13.6003 13.77 13.4203L12.76 13.0703V15.9203H12.75Z" fill="#F5F7FA"/><path d="M11.9701 1.90041C6.45007 1.92041 1.98007 6.41041 2.00007 11.9304C2.02007 17.4504 6.51007 21.9204 12.0301 21.9004C17.5501 21.8804 22.0201 17.3904 22.0001 11.8704C21.9801 6.35041 17.4901 1.89041 11.9701 1.90041ZM14.2601 12.0004C15.0401 12.2704 16.0901 12.8504 16.0901 14.6404C16.0901 16.1804 14.8801 17.4204 13.4001 17.4204H12.7501V18.0004C12.7501 18.4104 12.4101 18.7504 12.0001 18.7504C11.5901 18.7504 11.2501 18.4104 11.2501 18.0004V17.4204H10.8901C9.25007 17.4204 7.92007 16.0404 7.92007 14.3404C7.92007 13.9304 8.26007 13.5904 8.67007 13.5904C9.08007 13.5904 9.42007 13.9304 9.42007 14.3404C9.42007 15.2104 10.0801 15.9204 10.8901 15.9204H11.2501V12.5404L9.74007 12.0004C8.96007 11.7304 7.91007 11.1504 7.91007 9.36041C7.91007 7.82041 9.12007 6.58041 10.6001 6.58041H11.2501V6.00041C11.2501 5.59041 11.5901 5.25041 12.0001 5.25041C12.4101 5.25041 12.7501 5.59041 12.7501 6.00041V6.58041H13.1101C14.7501 6.58041 16.0801 7.96041 16.0801 9.66041C16.0801 10.0704 15.7401 10.4104 15.3301 10.4104C14.9201 10.4104 14.5801 10.0704 14.5801 9.66041C14.5801 8.79041 13.9201 8.08041 13.1101 8.08041H12.7501V11.4604L14.2601 12.0004Z" fill="#F5F7FA"/><path d="M9.41992 9.37008C9.41992 10.2401 9.72992 10.4101 10.2399 10.5901L11.2499 10.9401V8.08008H10.5999C9.94992 8.08008 9.41992 8.66008 9.41992 9.37008Z" fill="#F5F7FA"/></svg></span>
                        <span class="flex-1 text-left text-[14px] leading-[17px]" data-i18n="mainCurrency">Main Currency</span>
                        <span class="flex items-center gap-1 flex-none">
                            <span id="profile-currency-value" class="text-[#8B93A7] text-[14px] leading-[17px]">USD</span>
                            <svg width="16" height="16" viewBox="0 0 16 16" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M6.16699 13L11.167 8L6.16699 3" stroke-width="1.33333" stroke-linecap="round" stroke-linejoin="round" stroke="#8B93A7"/></svg>
                        </span>
                    </button>
                </div>
                <button type="button" onclick="resetAllData()" class="w-full h-14 rounded-full bg-[rgba(255,255,255,0.06)] text-[#F5F7FA] font-semibold text-[16px] leading-[19px] active:scale-95 transition-transform" data-i18n="resetData">Reset Data</button>
            </main>

            <!-- ЭКРАН: LANGUAGE (большой заголовок + collapsing navbar) -->
            <main id="screen-language" class="screen hidden">
                <h1 class="nt-large-title" data-i18n="language">Language</h1>
                <div id="language-list"></div>
            </main>

            <!-- ЭКРАН: CURRENCY (большой заголовок + collapsing navbar) -->
            <main id="screen-currency" class="screen hidden">
                <h1 class="nt-large-title" data-i18n="mainCurrency">Main Currency</h1>
                <div id="currency-list"></div>
            </main>

        </div>

        <!-- FAB-БЛОК: кнопка добавления транзакции в градиентной подложке
             (#171A1F 0% → 100% на стопе 90%). Отступы: 24 сверху,
             20 снизу в вебе / 50 от края экрана в iOS PWA -->
        <div id="fab-wrap" style="display:none">
            <button type="button" id="fab-add" onclick="openTxModal()" data-i18n="addTransaction">Add Transaction</button>
        </div>

        <!-- Нижний фейд 56px для всех страниц БЕЗ FAB-блока (у него свой
             градиент). Тот же стиль: #171A1F, 0% → opacity 0, 90% → 100 -->
        <div id="nt-bottom-fade" aria-hidden="true"></div>

        <!-- МОДАЛКА: ADD / EDIT ACCOUNT -->
        <div id="modal-account" class="modal-overlay hidden">
            <div class="absolute inset-0 bg-[#000000]/50" onclick="closeModal('modal-account')"></div>
            <div class="modal-sheet">
                <div class="modal-header">
                    <div class="w-[60px] h-[4px] bg-[#F5F7FA]/10 rounded-full mx-auto mt-[6px] mb-4"></div>
                    <div class="flex justify-between items-center px-4">
                        <button type="button" id="acc-close-btn" onclick="closeModal('modal-account')" class="w-11 h-11 rounded-full glass-ui flex items-center justify-center text-[#F5F7FA] active:scale-95 transition-transform"><i class="ph ph-x text-[24px]"></i></button>
                        <h2 id="acc-modal-title" class="h-11 flex items-center text-[16px] leading-[19px] font-semibold text-[#F5F7FA]">Add Account</h2>
                        <button type="button" id="acc-save-btn" onclick="saveAccount()" class="w-11 h-11 rounded-full btn-glass-flat text-[#8B93A7] flex items-center justify-center transition-transform"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M19.999 6.50098L8.99902 17.501L3.99902 12.501" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
                    </div>
                </div>
                <div class="modal-body px-4 pt-4 pb-12">
                    <div class="bg-[#232730] p-1 rounded-full flex mb-[56px] h-[54px]">
                        <button type="button" id="acc-type-asset" onclick="setAccType('asset')" class="flex-1 py-3 rounded-full bg-[#1A1D24] text-white text-[15px] font-medium shadow-sm transition-all" data-i18n="asset">Asset</button>
                        <button type="button" id="acc-type-debt" onclick="setAccType('debt')" class="flex-1 py-3 rounded-full text-[#8B93A7] text-[15px] font-medium transition-all" data-i18n="debt">Debt</button>
                    </div>
                    <div class="mb-[56px]">
                        <input type="text" id="acc-name" oninput="updateAccSaveBtn()" placeholder="Name" data-i18n-ph="name" class="w-full bg-transparent text-center text-[40px] leading-[48px] font-bold outline-none placeholder:text-[#8B93A7]">
                    </div>
                    <div class="mb-6">
                        <label class="text-[14px] leading-[17px] text-[#8B93A7] mb-3 block" data-i18n="icon">Icon</label>
                        <div id="acc-icon-picker" class="flex gap-2 overflow-x-auto"></div>
                    </div>
                    <div class="mb-10">
                        <label class="text-[14px] leading-[17px] text-[#8B93A7] mb-3 block" data-i18n="currencies">Currencies</label>
                        <div id="acc-currency-chips" class="flex gap-2 flex-wrap"></div>
                    </div>
                    <button type="button" id="acc-delete-btn" onclick="deleteAccount()" class="hidden w-full bg-[rgba(255,255,255,0.06)] text-white font-semibold text-[17px] py-4 rounded-full active:scale-95 transition-transform" data-i18n="deleteAccount">Delete Account</button>
                </div>
            </div>
        </div>

        <!-- МОДАЛКА: ADD TRANSACTION (2 шага) -->
        <div id="modal-add-tx" class="modal-overlay hidden">
            <div class="absolute inset-0 bg-[#000000]/50" onclick="closeModal('modal-add-tx')"></div>
            <div class="modal-sheet">
                <div class="modal-header">
                    <div class="w-[60px] h-[4px] bg-[#F5F7FA]/10 rounded-full mx-auto mt-[6px] mb-4"></div>
                    <div id="tx-step-1-head" class="flex justify-between items-center px-4">
                        <button type="button" onclick="closeModal('modal-add-tx')" class="w-11 h-11 rounded-full glass-ui flex items-center justify-center text-[#F5F7FA] active:scale-95 transition-transform"><i class="ph ph-x text-[24px]"></i></button>
                        <h2 class="h-11 flex items-center text-[16px] leading-[19px] font-semibold text-[#F5F7FA]" data-i18n="selectAccount">Select Account</h2>
                        <div class="w-11"></div>
                    </div>
                    <div id="tx-step-2-head" class="hidden flex justify-between items-center px-4">
                        <button type="button" onclick="backToTxStep1()" class="w-11 h-11 rounded-full glass-ui flex items-center justify-center text-[#F5F7FA] active:scale-95 transition-transform"><i class="ph ph-caret-left text-[24px]"></i></button>
                        <h2 class="h-11 flex items-center text-[16px] leading-[19px] font-semibold text-[#F5F7FA]" data-i18n="addTransaction">Add Transaction</h2>
                        <div class="w-11"></div>
                    </div>
                </div>
                <div class="modal-body px-4 pt-4 pb-12">
                    <div id="tx-step-1"><div id="tx-accounts-list"></div></div>
                    <div id="tx-step-2" class="hidden">
                        <p class="text-center text-[#8B93A7] text-[14px] mb-4 pt-2"><span data-i18n="to">to</span> <span id="tx-selected-account" class="text-[#F5F7FA] font-medium"></span></p>
                        <!-- Сумма сразу под заголовком: при открытии клавиатуры
                             поле уже над ней, iOS ничего не двигает -->
                        <div class="text-center mb-6">
                            <div class="flex items-center justify-center">
                                <input type="text" inputmode="decimal" id="tx-amount" placeholder="0" class="bg-transparent text-[64px] font-bold text-center w-auto outline-none placeholder:text-[#8B93A7] leading-none">
                                <span id="tx-amount-symbol" class="text-[#8B93A7] text-[24px] font-semibold ml-2 mt-3"></span>
                            </div>
                        </div>
                        <div id="tx-currency-chips" class="flex justify-center gap-2 mb-8"></div>
                        <div class="bg-[#232730] p-1 rounded-full flex mb-8 h-[54px]">
                            <button type="button" id="btn-expense" onclick="setTxType('expense')" class="flex-1 py-3 rounded-full bg-[#1A1D24] text-white text-[15px] font-medium shadow-sm" data-i18n="expense">Expense</button>
                            <button type="button" id="btn-income" onclick="setTxType('income')" class="flex-1 py-3 rounded-full text-[#8B93A7] text-[15px] font-medium" data-i18n="income">Income</button>
                        </div>
                        <div class="mb-8">
                            <label class="text-[14px] text-[#8B93A7] mb-2 block font-medium" data-i18n="note">Note</label>
                            <input type="text" id="tx-note" placeholder="Coffee..." class="w-full bg-[#232730] border border-white/5 rounded-[16px] p-4 outline-none placeholder:text-[#8B93A7] text-[16px]">
                        </div>
                        <button type="button" onclick="saveTransaction()" class="w-full bg-[#4C8DFF] text-white font-semibold text-[17px] py-4 rounded-[20px] active:scale-95 transition-transform" data-i18n="confirm">Confirm</button>
                    </div>
                </div>
            </div>
        </div>

        <!-- МОДАЛКА: ACCOUNT DETAIL -->
        <div id="modal-account-detail" class="modal-overlay hidden">
            <div class="absolute inset-0 bg-[#000000]/50" onclick="closeModal('modal-account-detail')"></div>
            <div class="modal-sheet">
                <div class="modal-header">
                    <div class="w-[60px] h-[4px] bg-[#F5F7FA]/10 rounded-full mx-auto mt-[6px] mb-4"></div>
                    <div class="flex justify-between items-center px-4">
                        <button type="button" onclick="closeModal('modal-account-detail')" class="w-11 h-11 rounded-full glass-ui flex items-center justify-center text-[#F5F7FA] active:scale-95 transition-transform"><i class="ph ph-x text-[24px]"></i></button>
                        <h2 id="ad-header-name" class="h-11 flex items-center text-[16px] leading-[19px] font-semibold text-[#F5F7FA] max-w-[200px] truncate"></h2>
                        <button type="button" id="ad-edit-btn" class="w-11 h-11 rounded-full glass-ui flex items-center justify-center text-[#F5F7FA] active:scale-95 transition-transform"><i class="ph ph-pencil-simple text-xl"></i></button>
                    </div>
                </div>
                <div class="modal-body px-4 pt-4 pb-12">
                    <div class="flex flex-col items-center mb-10 px-4">
                        <div id="ad-icon-wrap" class="w-16 h-16 rounded-full flex items-center justify-center mb-4 bg-[rgba(255,255,255,0.06)]">
                            <span id="ad-icon" class="flex items-center justify-center"></span>
                        </div>
                        <h3 id="ad-name" class="text-[34px] font-bold text-center leading-[40px] break-words"></h3>
                    </div>
                    <div id="ad-balances"></div>
                </div>
            </div>
        </div>

        <!-- СПЛЕШ -->
