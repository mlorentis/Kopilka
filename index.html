<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover, interactive-widget=resizes-content">
    <!-- iOS PWA: viewport-fit=cover отдаёт webview весь экран, включая
         зону под индикатором Home. В standalone корень приложения
         (.app-container) крепится position:fixed inset:0 — см. style.css -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#171A1F">
    <!-- PWA -->
    <link rel="manifest" href="manifest.json">
    <link rel="apple-touch-icon" href="apple-touch-icon.png">
    <title>Kopilka</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { sans: ['Inter', 'sans-serif'] }
                }
            }
        }
    </script>
    <script src="https://unpkg.com/@phosphor-icons/web@2.1.1"></script>

    <link rel="stylesheet" href="style.css?v=32">
</head>
<body class="text-[#F5F7FA] font-sans antialiased bg-[#171A1F]">

    <div class="app-container">

        <!-- ШАПКА: flex-ребёнок, физически не скроллится. Контент — JS.
             На внутренних страницах: шеврон назад + .hdr-title по центру
             (появляется при скролле на страницах с большим заголовком) -->
        <header id="main-header">
            <div id="main-header-inner"></div>
        </header>

        <!-- КОНТЕНТ: единственный скроллящийся блок -->
        <div id="app-content">

            <!-- ЭКРАН: HOME -->
            <main id="screen-home" class="screen">
                <!-- NET WORTH (по макету виден всегда, даже в пустом состоянии) -->
                <div id="block-networth" class="flex-col items-center mb-6 py-8" style="display:flex">
                    <p class="text-[#8B93A7] text-[16px] font-semibold leading-[19px] h-[19px] mb-2" data-i18n="netWorth">Net Worth</p>
                    <h1 id="net-worth-amount" class="text-[48px] font-bold leading-[58px] tracking-tight">0<span class="text-[#8B93A7] text-[36px] leading-[44px]">,00 $</span></h1>
                    <p id="delta-row" onclick="ntCycleDelta()" class="text-[16px] font-semibold leading-[19px] h-[19px] mt-1 cursor-pointer active:opacity-70 transition-opacity"><span id="net-worth-delta" class="text-[#8B93A7]">0 $</span><span id="delta-period" class="text-[#8B93A7] ml-1">24h</span></p>
                </div>

                <!-- СЕГМЕНТ ASSET / DEBT -->
                <div id="home-segment" class="glass-ui rounded-full flex items-center h-[54px] p-1 mb-6">
                    <button type="button" id="seg-asset" onclick="ntSetSeg('asset')" class="flex-1 rounded-full text-[15px] font-medium transition-all" data-i18n="asset">Asset</button>
                    <button type="button" id="seg-debt" onclick="ntSetSeg('debt')" class="flex-1 rounded-full text-[15px] font-medium transition-all" data-i18n="debt">Debt</button>
                </div>

                <!-- СЧЕТА: карусель карточек или карточка Add account (рендерит nt.js) -->
                <div id="home-accounts" class="mb-10"></div>

                <!-- OPERATIONS: 3 последние + переход в историю (рендерит nt.js) -->
                <div id="block-operations" class="mb-4">
                    <div id="home-operations-head"></div>
                    <div id="home-operations-list"></div>
                </div>
            </main>

            <!-- ЭКРАН: ACCOUNTS (скрытый, нужен app.js для совместимости) -->
            <main id="screen-accounts" class="screen hidden">
                <div id="acc-segment" class="glass-ui p-1 rounded-full flex mb-8">
                    <button type="button" id="acc-tab-assets" onclick="setAccountTab('asset')" class="flex-1 py-2.5 rounded-full bg-[#232730] text-white text-[15px] font-medium shadow-sm">Assets</button>
                    <button type="button" id="acc-tab-debts" onclick="setAccountTab('debt')" class="flex-1 py-2.5 rounded-full text-[#8B93A7] text-[15px] font-medium">Debts</button>
                </div>
                <div id="accounts-list" class="flex-1 flex flex-col"></div>
            </main>

            <!-- ЭКРАН: HISTORY -->
            <main id="screen-history" class="screen hidden">
                <div id="history-list" class="flex-1 flex flex-col"></div>
            </main>

            <!-- ЭКРАН: PROFILE -->
            <main id="screen-profile" class="screen hidden">
                <div class="flex flex-col items-center pt-6 mb-8">
                    <div class="w-[100px] h-[100px] rounded-full bg-[rgba(255,255,255,0.06)] flex items-center justify-center mb-4">
                        <span class="text-[36px] font-semibold leading-none">M</span>
                    </div>
                    <h2 class="text-[28px] font-bold tracking-tight">Mikhail</h2>
                </div>
                <div class="glass-ui rounded-[24px] px-4 mb-6">
                    <button type="button" onclick="switchTab('language')" class="nt-set-row">
                        <span class="nt-set-icon"><i class="ph ph-globe text-[20px]"></i></span>
                        <span class="flex-1 text-left text-[17px] font-medium" data-i18n="language">Language</span>
                        <span id="profile-lang-value" class="text-[#8B93A7] text-[16px]">English</span>
                        <i class="ph ph-caret-right text-[18px] text-[#8B93A7]"></i>
                    </button>
                    <div class="h-px bg-white/5 ml-[48px]"></div>
                    <button type="button" onclick="switchTab('currency')" class="nt-set-row">
                        <span class="nt-set-icon"><i class="ph ph-currency-dollar text-[20px]"></i></span>
                        <span class="flex-1 text-left text-[17px] font-medium" data-i18n="mainCurrency">Main Currency</span>
                        <span id="profile-currency-value" class="text-[#8B93A7] text-[16px]">USD</span>
                        <i class="ph ph-caret-right text-[18px] text-[#8B93A7]"></i>
                    </button>
                </div>
                <button type="button" onclick="resetAllData()" class="w-full h-[52px] rounded-full bg-[rgba(255,255,255,0.06)] text-white font-semibold text-[17px] active:scale-95 transition-transform" data-i18n="resetData">Reset Data</button>
            </main>

            <!-- ЭКРАН: LANGUAGE (большой заголовок + collapsing navbar) -->
            <main id="screen-language" class="screen hidden">
                <h1 class="nt-large-title" data-i18n="language">Language</h1>
                <div id="language-list"></div>
            </main>

            <!-- ЭКРАН: CURRENCY (большой заголовок + collapsing navbar) -->
            <main id="screen-currency" class="screen hidden">
                <h1 class="nt-large-title" data-i18n="mainCurrency">Main Currency</h1>
                <div id="currency-list"></div>
            </main>

        </div>

        <!-- FAB-ПИЛЮЛЯ: добавление транзакции. absolute внутри .app-container,
             по центру, 50px от низа -->
        <button type="button" id="fab-add" onclick="openTxModal()" data-i18n="addTransaction" style="display:none">Add Transaction</button>

        <!-- МОДАЛКА: ADD / EDIT ACCOUNT -->
        <div id="modal-account" class="modal-overlay hidden">
            <div class="absolute inset-0 bg-[#000000]/50" onclick="closeModal('modal-account')"></div>
            <div class="modal-sheet">
                <div class="modal-header">
                    <div class="w-[60px] h-[6px] bg-[#F5F7FA]/20 rounded-full mx-auto mb-6"></div>
                    <div class="flex justify-between items-center">
                        <button type="button" id="acc-close-btn" onclick="closeModal('modal-account')" class="w-11 h-11 rounded-full glass-ui flex items-center justify-center text-[#F5F7FA] active:scale-95 transition-transform"><i class="ph ph-x text-xl"></i></button>
                        <h2 id="acc-modal-title" class="h-11 flex items-center text-[18px] font-semibold">Add Account</h2>
                        <button type="button" id="acc-save-btn" onclick="saveAccount()" class="w-11 h-11 rounded-full glass-ui text-[#8B93A7] flex items-center justify-center transition-transform"><i class="ph ph-check text-xl"></i></button>
                    </div>
                </div>
                <div class="modal-body px-6 pb-12">
                    <div class="bg-[#232730] p-1 rounded-full flex mb-8 h-[54px]">
                        <button type="button" id="acc-type-asset" onclick="setAccType('asset')" class="flex-1 py-3 rounded-full bg-[#1A1D24] text-white text-[15px] font-medium shadow-sm transition-all" data-i18n="asset">Asset</button>
                        <button type="button" id="acc-type-debt" onclick="setAccType('debt')" class="flex-1 py-3 rounded-full text-[#8B93A7] text-[15px] font-medium transition-all" data-i18n="debt">Debt</button>
                    </div>
                    <div class="mb-8">
                        <input type="text" id="acc-name" oninput="updateAccSaveBtn()" placeholder="Name" data-i18n-ph="name" class="w-full bg-transparent text-center text-[36px] font-semibold outline-none placeholder:text-[#8B93A7] leading-tight">
                    </div>
                    <div class="mb-8">
                        <label class="text-[14px] text-[#8B93A7] mb-3 block font-medium text-center" data-i18n="icon">Icon</label>
                        <div id="acc-icon-picker" class="flex justify-center gap-3"></div>
                    </div>
                    <div class="mb-10">
                        <label class="text-[14px] text-[#8B93A7] mb-3 block font-medium text-center" data-i18n="currencies">Currencies</label>
                        <div id="acc-currency-chips" class="flex justify-center gap-2 flex-wrap"></div>
                    </div>
                    <button type="button" id="acc-delete-btn" onclick="deleteAccount()" class="hidden w-full bg-[rgba(255,255,255,0.06)] text-white font-semibold text-[17px] py-4 rounded-full active:scale-95 transition-transform" data-i18n="deleteAccount">Delete Account</button>
                </div>
            </div>
        </div>

        <!-- МОДАЛКА: ADD TRANSACTION (2 шага) -->
        <div id="modal-add-tx" class="modal-overlay hidden">
            <div class="absolute inset-0 bg-[#000000]/50" onclick="closeModal('modal-add-tx')"></div>
            <div class="modal-sheet">
                <div class="modal-header">
                    <div class="w-[60px] h-[6px] bg-[#F5F7FA]/20 rounded-full mx-auto mb-6"></div>
                    <div id="tx-step-1-head" class="flex justify-between items-center">
                        <button type="button" onclick="closeModal('modal-add-tx')" class="w-11 h-11 rounded-full glass-ui flex items-center justify-center text-[#F5F7FA] active:scale-95 transition-transform"><i class="ph ph-x text-xl"></i></button>
                        <h2 class="h-11 flex items-center text-[18px] font-semibold" data-i18n="selectAccount">Select Account</h2>
                        <div class="w-11"></div>
                    </div>
                    <div id="tx-step-2-head" class="hidden flex justify-between items-center">
                        <button type="button" onclick="backToTxStep1()" class="w-11 h-11 rounded-full glass-ui flex items-center justify-center text-[#F5F7FA] active:scale-95 transition-transform"><i class="ph ph-arrow-left text-xl"></i></button>
                        <h2 class="h-11 flex items-center text-[18px] font-semibold" data-i18n="addTransaction">Add Transaction</h2>
                        <div class="w-11"></div>
                    </div>
                </div>
                <div class="modal-body px-6 pb-12">
                    <div id="tx-step-1"><div id="tx-accounts-list"></div></div>
                    <div id="tx-step-2" class="hidden">
                        <p class="text-center text-[#8B93A7] text-[14px] mb-4 pt-2"><span data-i18n="to">to</span> <span id="tx-selected-account" class="text-[#F5F7FA] font-medium"></span></p>
                        <!-- Сумма сразу под заголовком: при открытии клавиатуры
                             поле уже над ней, iOS ничего не двигает -->
                        <div class="text-center mb-6">
                            <div class="flex items-center justify-center">
                                <input type="text" inputmode="decimal" id="tx-amount" placeholder="0" class="bg-transparent text-[64px] font-bold text-center w-auto outline-none placeholder:text-[#8B93A7] leading-none">
                                <span id="tx-amount-symbol" class="text-[#8B93A7] text-[24px] font-semibold ml-2 mt-3"></span>
                            </div>
                        </div>
                        <div id="tx-currency-chips" class="flex justify-center gap-2 mb-8"></div>
                        <div class="bg-[#232730] p-1 rounded-full flex mb-8 h-[54px]">
                            <button type="button" id="btn-expense" onclick="setTxType('expense')" class="flex-1 py-3 rounded-full bg-[#1A1D24] text-white text-[15px] font-medium shadow-sm" data-i18n="expense">Expense</button>
                            <button type="button" id="btn-income" onclick="setTxType('income')" class="flex-1 py-3 rounded-full text-[#8B93A7] text-[15px] font-medium" data-i18n="income">Income</button>
                        </div>
                        <div class="mb-8">
                            <label class="text-[14px] text-[#8B93A7] mb-2 block font-medium" data-i18n="note">Note</label>
                            <input type="text" id="tx-note" placeholder="Coffee..." class="w-full bg-[#232730] border border-white/5 rounded-[16px] p-4 outline-none placeholder:text-[#8B93A7] text-[16px]">
                        </div>
                        <button type="button" onclick="saveTransaction()" class="w-full bg-[#4C8DFF] text-white font-semibold text-[17px] py-4 rounded-[20px] active:scale-95 transition-transform" data-i18n="confirm">Confirm</button>
                    </div>
                </div>
            </div>
        </div>

        <!-- МОДАЛКА: ACCOUNT DETAIL -->
        <div id="modal-account-detail" class="modal-overlay hidden">
            <div class="absolute inset-0 bg-[#000000]/50" onclick="closeModal('modal-account-detail')"></div>
            <div class="modal-sheet">
                <div class="modal-header">
                    <div class="w-[60px] h-[6px] bg-[#F5F7FA]/20 rounded-full mx-auto mb-6"></div>
                    <div class="flex justify-between items-center">
                        <button type="button" onclick="closeModal('modal-account-detail')" class="w-11 h-11 rounded-full glass-ui flex items-center justify-center text-[#F5F7FA] active:scale-95 transition-transform"><i class="ph ph-x text-xl"></i></button>
                        <h2 id="ad-header-name" class="h-11 flex items-center text-[15px] font-semibold max-w-[200px] truncate"></h2>
                        <button type="button" id="ad-edit-btn" class="w-11 h-11 rounded-full glass-ui flex items-center justify-center text-[#F5F7FA] active:scale-95 transition-transform"><i class="ph ph-pencil-simple text-xl"></i></button>
                    </div>
                </div>
                <div class="modal-body px-6 pb-12">
                    <div class="flex flex-col items-center mb-10 px-4">
                        <div id="ad-icon-wrap" class="w-16 h-16 rounded-full flex items-center justify-center mb-4 bg-[rgba(255,255,255,0.06)]">
                            <span id="ad-icon" class="flex items-center justify-center"></span>
                        </div>
                        <h3 id="ad-name" class="text-[34px] font-bold text-center leading-[40px] break-words"></h3>
                    </div>
                    <div id="ad-balances"></div>
                </div>
            </div>
        </div>

        <!-- СПЛЕШ -->
        <div id="splash">
            <svg width="64" height="64" viewBox="0 0 44 44" fill="none" xmlns="http://www.w3.org/2000/svg">
                <path d="M40.3341 20.1117V23.8884C40.3341 24.8967 39.5274 25.7217 38.5007 25.7584H34.9074C32.9274 25.7584 31.1124 24.31 30.9474 22.33C30.8374 21.175 31.2774 20.0934 32.0474 19.3417C32.7257 18.645 33.6607 18.2417 34.6874 18.2417H38.5007C39.5274 18.2784 40.3341 19.1034 40.3341 20.1117Z" fill="#4C8DFF"/>
                <path d="M37.5287 28.5082H34.907C31.4237 28.5082 28.4903 25.8865 28.197 22.5498C28.032 20.6432 28.7287 18.7365 30.122 17.3798C31.2953 16.1698 32.927 15.4915 34.687 15.4915H37.5287C38.0603 15.4915 38.5003 15.0515 38.4453 14.5198C38.042 10.0648 35.0903 7.0215 30.7087 6.50817C30.2687 6.43484 29.8103 6.4165 29.3337 6.4165H12.8337C12.3203 6.4165 11.8253 6.45317 11.3487 6.5265C6.67366 7.11317 3.66699 10.5965 3.66699 15.5832V28.4165C3.66699 33.4765 7.77366 37.5832 12.8337 37.5832H29.3337C34.467 37.5832 38.0053 34.3748 38.4453 29.4798C38.5003 28.9482 38.0603 28.5082 37.5287 28.5082ZM23.8337 17.8748H12.8337C12.082 17.8748 11.4587 17.2515 11.4587 16.4998C11.4587 15.7482 12.082 15.1248 12.8337 15.1248H23.8337C24.5853 15.1248 25.2087 15.7482 25.2087 16.4998C25.2087 17.2515 24.5853 17.8748 23.8337 17.8748Z" fill="#4C8DFF"/>
            </svg>
            <p class="text-[#8B93A7] text-[14px] font-medium tracking-wide">Kopilka</p>
        </div>

        <!-- Общий градиент стекла для заливки SVG-иконок (белый 5%) -->
        <svg width="0" height="0" style="position:absolute" aria-hidden="true">
            <defs>
                <linearGradient id="kopilkaGlass" x1="0%" y1="0%" x2="100%" y2="100%">
                    <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.05"/>
                    <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.05"/>
                </linearGradient>
            </defs>
        </svg>

    </div>

    <script src="app.js?v=25"></script>
    <script src="nt.js?v=11"></script>
</body>
</html>
