                            <path d="M8 2.42871V13.5716" stroke-width="1.33" stroke-linecap="round" stroke-linejoin="round" stroke="#F5F7FA"/>
                            <path d="M2.42871 8H13.5716" stroke-width="1.33" stroke-linecap="round" stroke-linejoin="round" stroke="#F5F7FA"/>
                        </svg>

                    </button>
                </div>
            </main>

            <main id="screen-history" class="screen hidden"></main>

                    </svg>
                    <span class="text-[10px] font-semibold leading-[12px]">History</span>
                </button>
            </div>
            <button type="button" id="fab-add-tx" class="hidden w-[64px] h-[64px] rounded-full bg-[#4C8DFF] flex items-center justify-center flex-shrink-0 active:scale-95 transition-transform">
                <svg width="28" height="28" viewBox="0 0 16 16" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <path d="M8 2.42871V13.5716" stroke-width="1.33" stroke-linecap="round" stroke-linejoin="round" stroke="#F5F7FA"/>
